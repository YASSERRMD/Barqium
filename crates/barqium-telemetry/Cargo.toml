[package]
name        = "barqium-telemetry"
description = "OTLP exporter and Kafka producer for Barqium request telemetry."
version.workspace   = true
edition.workspace   = true
authors.workspace   = true
license.workspace   = true

[dependencies]
tokio                = { workspace = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry        = { workspace = true }
opentelemetry_sdk    = { workspace = true }
# HTTP/proto transport; disable default grpc-tonic to avoid tonic dependency.
opentelemetry-otlp   = { workspace = true, features = ["http-proto", "reqwest-client"] }
thiserror            = { workspace = true }
