[workspace]
resolver = "2"
members  = [
    "crates/barqium",
    "crates/barqium-config",
    "crates/barqium-core",
    "crates/barqium-protocols",
    "crates/barqium-policy",
    "crates/barqium-ai",
    "crates/barqium-mcp",
    "crates/barqium-snapshot",
    "crates/barqium-telemetry",
    "crates/barqium-wasm",
    "crates/barqium-xdp",
]

[workspace.package]
version    = "0.1.0"
edition    = "2021"
authors    = ["YASSERRMD <arafath.yasser@gmail.com>"]
license    = "Apache-2.0"
repository = "https://github.com/yasserrmd/barqium"

# ---------------------------------------------------------------------------
# Shared dependency versions — individual crates opt-in with { workspace = true }
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Async runtime
tokio      = { version = "1", features = ["full"] }
tokio-util = { version = "0.7" }

# HTTP stack
hyper          = { version = "1", features = ["full"] }
hyper-util     = { version = "0.1", features = ["tokio"] }
http           = { version = "1" }
http-body-util = { version = "0.1" }
tower          = { version = "0.4", features = ["full"] }
tower-service  = { version = "0.3" }

# TLS
rustls         = { version = "0.23" }
tokio-rustls   = { version = "0.26" }
rustls-pemfile = { version = "2" }

# Serialization and shared-memory
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
prost      = { version = "0.13" }
rkyv       = { version = "0.7", features = ["validation"] }
mmap-sync  = { version = "2" }
bytes      = { version = "1" }

# Messaging
rdkafka = { version = "0.36", features = ["tokio"] }

# Distributed state
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# HTTP client (JWKS fetch, webhook calls)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Auth
jsonwebtoken = { version = "9" }
ring         = { version = "0.17" }

# Telemetry
tracing               = { version = "0.1" }
tracing-subscriber    = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry         = { version = "0.24" }
opentelemetry-otlp    = { version = "0.17", default-features = false }
opentelemetry_sdk     = { version = "0.24", features = ["rt-tokio"] }
tracing-opentelemetry = { version = "0.25" }

# Error handling
thiserror = { version = "1" }
anyhow    = { version = "1" }

# Async trait support (needed for dyn-compatible async provider trait)
async-trait = { version = "0.1" }

# HNSW approximate nearest-neighbour index for semantic cache
instant-distance = { version = "0.6" }

# HTTP/3 (QUIC) stack
# h3-quinn is excluded: both 0.0.6 and 0.0.7 have a StreamId private-field
# incompatibility with quinn 0.11.x. QUIC transport is implemented via quinn
# directly; H3 framing will be added when h3-quinn publishes a fix.
quinn = { version = "0.11", features = ["rustls"] }

# WASM plugin runtime
wasmtime = { version = "25", default-features = false, features = ["cranelift", "component-model", "async"] }

# File-system watcher for WASM hot reload
notify = { version = "6" }

# XML parsing for SOAP mediation
quick-xml = { version = "0.36", features = ["serialize"] }

# TLS acceleration (optional in individual crates — AWS-LC FIPS-compliant crypto)
aws-lc-rs = { version = "1" }

# Utilities
uuid      = { version = "1", features = ["v4", "serde"] }
chrono    = { version = "0.4", features = ["serde"] }
futures   = { version = "0.3" }
dashmap   = { version = "6" }
arc-swap  = { version = "1" }
once_cell = { version = "1" }

# Cryptographic hashing (SHA-256 for GraphQL persisted queries etc.)
sha2    = { version = "0.10" }
hex     = { version = "0.4" }
# Low-level socket options (SO_REUSEPORT for XDP / multi-listener)
socket2 = { version = "0.5", features = ["all"] }

# Testing and benchmarks
proptest  = { version = "1" }
criterion = { version = "0.5", features = ["html_reports"] }

# ---------------------------------------------------------------------------
# Build profiles
# ---------------------------------------------------------------------------

[profile.release]
opt-level = 3

# Edge profile — minimal binary for CDN/edge nodes.
# Inherits from release and applies additional size-reduction flags.
#
# Usage:
#   cargo build --profile edge --no-default-features --features edge
#
# opt-level 3    — maximum instruction-level optimisation
# lto = "thin"   — cross-crate inlining without full LTO compile-time cost
# codegen-units = 1 — single CGU for better cross-function optimisation
# panic = "abort" — removes unwinding machinery (~50 kB savings)
# strip = true   — strips debug symbols from the final ELF/Mach-O
[profile.edge]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
